<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<meta name="description" content="Easy Party — ألعاب حفلات سريعة وممتعة">
<link rel="manifest" href="./manifest.json?v=8">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/theme.css?v=8">
<link rel="stylesheet" href="./css/components.css?v=8">
<link rel="stylesheet" href="./css/screens.css?v=8">
<title>Easy Party</title>
</head>
<body>
<div id="hud"></div>
<main id="app"><section class="screen fade-in"><div class="hero"><div class="logo">EASY <span>PARTY</span></div><p class="subtitle">جاري تشغيل اللعبة…</p></div></section></main>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('easy-party-')).map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('PWA cleanup skipped',e)}
  window.__easyPartyReady=import('./js/main.js?v=8');
  try{await window.__easyPartyReady}catch(e){console.error(e)}
})();
</script>
</body>
</html>
